buildscript {
    apply(from: {
        def searchDir = rootDir.toPath()
        do {
            def p = searchDir.resolve("node_modules/react-native-test-app/android/dependencies.gradle")
            if (p.toFile().exists()) {
                return p.toRealPath().toString()
            }
        } while (searchDir = searchDir.getParent())
        throw new GradleException("Could not find `react-native-test-app`");
    }())

    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        getReactNativeDependencies().each { dependency ->
            classpath(dependency)
        }
    }
}

// react-native-video was removed (its ReactExoplayerView.java source hard-required
// androidx.media3 1.8.0, which conflicted with react-native-vision-camera's CameraX
// 1.7.0-alpha02 recording path requiring media3-muxer 1.9.0 — see example/README.md). With it
// gone, media3 has no forced version and CameraX's own requirements resolve on their own.
